<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Velha Definitivo</title>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script async src="https://ga.jspm.io/npm:es-module-shims@1.7.0/dist/es-module-shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react?dev",
      "react-dom/client": "https://esm.sh/react-dom/client?dev"
    }
  }
  </script>
  <!-- Biblioteca de Confetes para Celebração -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --surface-color: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --color-x: #38bdf8;
      --color-o: #f43f5e;
      --board-bg: #334155;
    }

    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --surface-color: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --color-x: #0284c7;
      --color-o: #e11d48;
      --board-bg: #e2e8f0;
    }

    [data-theme="romantic"] {
      --bg-color: #fff0f5;
      --surface-color: #ffffff;
      --text-main: #4a4a4a;
      --text-muted: #888888;
      --accent: #e91e63;
      --accent-hover: #c2185b;
      --color-x: #d81b60;
      --color-o: #ff69b4;
      --board-bg: #fff5f8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .game {
      background: var(--surface-color);
      padding: 2rem;
      border-radius: 1.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 420px;
      transition: background 0.3s ease;
    }

    .controls-top {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 0.8rem;
      gap: 6px;
    }

    .btn-small {
      flex: 1;
      padding: 0.45rem 0.3rem;
      background-color: var(--board-bg);
      color: var(--text-main);
      border: 1px solid var(--text-muted);
      border-radius: 0.5rem;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
      text-align: center;
    }

    .btn-small:hover {
      background-color: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .scoreboard {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin-bottom: 1rem;
      background: rgba(0, 0, 0, 0.04);
      padding: 0.6rem;
      border-radius: 0.75rem;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .score-x { color: var(--color-x); }
    .score-o { color: var(--color-o); }

    .status {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 1rem;
      text-align: center;
      padding: 0.5rem 1rem;
      background: rgba(0, 0, 0, 0.04);
      border-radius: 0.75rem;
      width: 100%;
    }

    .board-row {
      display: flex;
      justify-content: center;
    }

    .square {
      background: var(--board-bg);
      border: 3px solid var(--surface-color);
      border-radius: 12px;
      font-size: 2.5rem;
      font-weight: 900;
      height: 85px;
      width: 85px;
      margin: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-main);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      animation: popIn 0.2s ease-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .square:hover {
      filter: brightness(1.05);
      transform: translateY(-2px);
    }

    .square.x-player { color: var(--color-x); }
    .square.o-player { color: var(--color-o); }

    .actions-bottom {
      display: flex;
      gap: 8px;
      width: 100%;
      margin-top: 1.2rem;
    }

    .btn-main {
      flex: 1;
      padding: 0.75rem;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 0.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-main:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: var(--board-bg);
      color: var(--text-main);
      border: 1px solid var(--text-muted);
    }
    .btn-secondary:hover {
      background-color: var(--text-muted);
      color: white;
    }

    .square.winning {
  background-color: var(--accent);
  color: white;
  border-color: var(--accent);
  animation: pulse 1.5s infinite;
  z-index: 10;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); box-shadow: 0 0 15px var(--accent); }
  100% { transform: scale(1); }
}
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { StrictMode, useState, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';

    function playSound(type) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'click') {
          osc.frequency.setValueAtTime(400, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.08);
        } else if (type === 'win') {
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
          osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.35);
        }
      } catch (e) {}
    }

    function Square({ value, onSquareClick, ariaLabel }) {
      const playerClass = value === 'X' ? 'x-player' : value === 'O' ? 'o-player' : '';
      return (
        <button 
          className={`square ${playerClass}`} 
          onClick={onSquareClick}
          aria-label={ariaLabel}
        >
          {value}
        </button>
      );
    }

    function Board({ xIsNext, squares, onPlay }) {
      function handleClick(i) {
        if (calculateWinner(squares) || squares[i]) return;
        playSound('click');
        const nextSquares = squares.slice();
        nextSquares[i] = xIsNext ? 'X' : 'O';
        onPlay(nextSquares);
      }

      const winner = calculateWinner(squares);
      let status;
      if (winner) {
        status = '🏆 Vencedor: ' + winner;
      } else if (!squares.includes(null)) {
        status = '🤝 Empate!';
      } else {
        status = 'Vez de: ' + (xIsNext ? 'X' : 'O');
      }

      return (
        <div>
          <div className="status" aria-live="polite">{status}</div>
          {[0, 3, 6].map((row) => (
            <div key={row} className="board-row">
              <Square value={squares[row]} onSquareClick={() => handleClick(row)} ariaLabel={`Casa ${row+1}, valor ${squares[row] || 'vazio'}`} />
              <Square value={squares[row+1]} onSquareClick={() => handleClick(row+1)} ariaLabel={`Casa ${row+2}, valor ${squares[row+1] || 'vazio'}`} />
              <Square value={squares[row+2]} onSquareClick={() => handleClick(row+2)} ariaLabel={`Casa ${row+3}, valor ${squares[row+2] || 'vazio'}`} />
            </div>
          ))}
        </div>
      );
    }

    function calculateWinner(squares) {
      const lines = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8],
        [0, 3, 6], [1, 4, 7], [2, 5, 8],
        [0, 4, 8], [2, 4, 6]
      ];
      for (let i = 0; i < lines.length; i++) {
        const [a, b, c] = lines[i];
        if (squares[a] && squares[a] === squares[b] && squares[a] === squares[c]) {
          return squares[a];
        }
      }
      return null;
    }

    // Minimax para o modo Difícil
    function minimax(squares, depth, isMaximizing) {
      const winner = calculateWinner(squares);
      if (winner === 'O') return 10 - depth;
      if (winner === 'X') return depth - 10;
      if (!squares.includes(null)) return 0;

      if (isMaximizing) {
        let maxEval = -Infinity;
        for (let i = 0; i < squares.length; i++) {
          if (!squares[i]) {
            squares[i] = 'O';
            let evaluation = minimax(squares, depth + 1, false);
            squares[i] = null;
            maxEval = Math.max(maxEval, evaluation);
          }
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (let i = 0; i < squares.length; i++) {
          if (!squares[i]) {
            squares[i] = 'X';
            let evaluation = minimax(squares, depth + 1, true);
            squares[i] = null;
            minEval = Math.min(minEval, evaluation);
          }
        }
        return minEval;
      }
    }

    function findBestMove(squares, difficulty) {
      if (difficulty === 'easy') {
        const emptyIndexes = squares.map((val, idx) => val === null ? idx : null).filter(val => val !== null);
        if (emptyIndexes.length === 0) return -1;
        const randomIndex = emptyIndexes[Math.floor(Math.random() * emptyIndexes.length)];
        return randomIndex;
      } else {
        let bestVal = -Infinity;
        let bestMove = -1;
        for (let i = 0; i < squares.length; i++) {
          if (!squares[i]) {
            squares[i] = 'O';
            let moveVal = minimax(squares, 0, false);
            squares[i] = null;
            if (moveVal > bestVal) {
              bestVal = moveVal;
              bestMove = i;
            }
          }
        }
        return bestMove;
      }
    }

    let App = function Game() {
      const [history, setHistory] = useState([Array(9).fill(null)]);
      const [currentMove, setCurrentMove] = useState(0);
      const [gameMode, setGameMode] = useState('pvp'); // 'pvp', 'ai-easy', 'ai-hard'
      const [themeIndex, setThemeIndex] = useState(0); 
      
      // Placar persistente via localStorage
      const [scores, setScores] = useState(() => {
        const saved = localStorage.getItem('tictactoe_scores');
        return saved ? JSON.parse(saved) : { X: 0, O: 0, ties: 0 };
      });
      
      const [hasRecordedWin, setHasRecordedWin] = useState(false);

      const themes = ['dark', 'light', 'romantic'];
      const themeNames = ['🌙 Escuro', '☀️ Claro', '🌸 Rosa'];

      const xIsNext = currentMove % 2 === 0;
      const currentSquares = history[currentMove];
      const winner = calculateWinner(currentSquares);

      useEffect(() => {
        localStorage.setItem('tictactoe_scores', JSON.stringify(scores));
      }, [scores]);

      useEffect(() => {
        if (winner && !hasRecordedWin) {
          playSound('win');
          if (typeof confetti === 'function') {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
          }
          setScores(prev => ({ ...prev, [winner]: prev[winner] + 1 }));
          setHasRecordedWin(true);
        } else if (!winner && !currentSquares.includes(null) && !hasRecordedWin) {
          setScores(prev => ({ ...prev, ties: prev.ties + 1 }));
          setHasRecordedWin(true);
        }
      }, [winner, currentSquares, hasRecordedWin]);

      // Jogada automática da IA
      useEffect(() => {
        const isAiTurn = gameMode !== 'pvp' && !xIsNext;
        if (isAiTurn && !winner && currentSquares.includes(null)) {
          const difficulty = gameMode === 'ai-easy' ? 'easy' : 'hard';
          const timer = setTimeout(() => {
            const bestMove = findBestMove(currentSquares, difficulty);
            if (bestMove !== -1) {
              playSound('click');
              const nextSquares = currentSquares.slice();
              nextSquares[bestMove] = 'O';
              handlePlay(nextSquares);
            }
          }, 400);
          return () => clearTimeout(timer);
        }
      }, [gameMode, xIsNext, currentSquares, winner]);

      function handlePlay(nextSquares) {
        const nextHistory = [...history.slice(0, currentMove + 1), nextSquares];
        setHistory(nextHistory);
        setCurrentMove(nextHistory.length - 1);
        setHasRecordedWin(false);
      }

      function resetGame() {
        setHistory([Array(9).fill(null)]);
        setCurrentMove(0);
        setHasRecordedWin(false);
      }

      function resetScores() {
        setScores({ X: 0, O: 0, ties: 0 });
      }

      function cycleTheme() {
        const nextIndex = (themeIndex + 1) % themes.length;
        setThemeIndex(nextIndex);
        document.body.setAttribute('data-theme', themes[nextIndex]);
      }

      function cycleMode() {
        if (gameMode === 'pvp') setGameMode('ai-easy');
        else if (gameMode === 'ai-easy') setGameMode('ai-hard');
        else setGameMode('pvp');
        resetGame();
      }

      const modeLabels = {
        'pvp': '👥 2 Jogadores',
        'ai-easy': '🤖 IA Fácil',
        'ai-hard': '🤖 IA Difícil'
      };

      return (
        <div className="game">
          <div className="controls-top">
            <button className="btn-small" onClick={cycleMode}>
              {modeLabels[gameMode]}
            </button>
            <button className="btn-small" onClick={cycleTheme}>
              {themeNames[themeIndex]}
            </button>
          </div>

          <div className="scoreboard">
            <span className="score-x">X: {scores.X}</span>
            <span className="score-ties">Empates: {scores.ties}</span>
            <span className="score-o">O: {scores.O}</span>
          </div>

          <div className="game-board">
            <Board xIsNext={xIsNext} squares={currentSquares} onPlay={handlePlay} />
          </div>

          <div className="actions-bottom">
            <button className="btn-main" onClick={resetGame}>🔄 Reiniciar Jogo</button>
            <button className="btn-main btn-secondary" onClick={resetScores} title="Zerar Placar">🗑️ Placar</button>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(
      <StrictMode>
        <App />
      </StrictMode>
    );
  </script>
</body>
</html>
